name = "interagent-mesh"
main = "worker.js"
compatibility_date = "2026-03-06"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.json"]
fallthrough = false

# Custom domains — both subdomains serve the compositor
# interagent: primary compositor URL
# operations-agent: agent-specific URL (same content until tunnel DNS configured)
[[routes]]
pattern = "interagent.safety-quotient.dev"
custom_domain = true

[[routes]]
pattern = "operations-agent.safety-quotient.dev"
custom_domain = true

# API key storage + JTI nonce tracking + rate limit counters + agent card cache
[[kv_namespaces]]
binding = "AUTH_KV"
id = "2ab25ca0bcd34ffeb6d95d33138896c8"

# Set via: wrangler secret put OPERATOR_SECRET
# Required for POST /api/keys and DELETE /api/keys/:identity
