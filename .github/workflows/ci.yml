name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate vocabulary schema
        run: |
          python3 -c "
          import json, sys
          with open('interagent/vocab.json') as f:
              vocab = json.load(f)
          errors = []
          for field in ['@context', '@id', '@type', 'name', 'version', 'hasDefinedTerm']:
              if field not in vocab:
                  errors.append(f'Missing required field: {field}')
          for term in vocab.get('hasDefinedTerm', []):
              tid = term.get('@id', '?')
              if not term.get('name'): errors.append(f'{tid}: missing name')
              if not term.get('description'): errors.append(f'{tid}: missing description')
              if term.get('status') not in ('active','proposed','deprecated'):
                  errors.append(f'{tid}: invalid status')
          if errors:
              for e in errors: print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'Vocabulary v{vocab[\"version\"]}: {len(vocab[\"hasDefinedTerm\"])} terms — PASS')
          "

      - name: Validate agent-card schema
        run: |
          python3 -c "
          import json, sys
          with open('.well-known/agent-card.json') as f:
              card = json.load(f)
          errors = []
          # A2A 1.0.0 required fields (protocolVersion replaced by supported_interfaces)
          for field in ['name', 'version', 'provider']:
              if field not in card: errors.append(f'Missing required: {field}')
          # Must have either protocolVersion (0.3.0) or supported_interfaces (1.0.0)
          if 'protocolVersion' not in card and 'supported_interfaces' not in card:
              errors.append('Missing: protocolVersion or supported_interfaces')
          prov = card.get('provider', {})
          if isinstance(prov, dict) and not prov.get('organization'):
              errors.append('provider.organization missing')
          # Capabilities required in 1.0.0
          if 'capabilities' not in card:
              errors.append('Missing: capabilities')
          # Skills required
          if not card.get('skills'):
              errors.append('Missing or empty: skills')
          if errors:
              for e in errors: print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'Agent-card {card[\"name\"]} v{card.get(\"version\",\"?\")} — PASS')
          "

      - name: Transport integrity check
        run: |
          python3 -c "
          import json, os, sys
          errors = []
          for name in os.listdir('transport/sessions'):
              path = os.path.join('transport/sessions', name)
              if not os.path.isdir(path): continue
              if os.path.exists(os.path.join(path, '.archived')): continue
              if not os.path.exists(os.path.join(path, 'MANIFEST.json')):
                  errors.append(f'{name}: missing MANIFEST.json')
          if errors:
              for e in errors: print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          print(f'Transport integrity: PASS')
          "

      - name: Credential scan
        run: |
          # Fail if any actual credentials appear in tracked files
          if git grep -rn 'sk-ant-[a-zA-Z0-9]\{20,\}\|AKIA[A-Z0-9]\{16\}\|ghp_[a-zA-Z0-9]\{36\}' HEAD -- ':!.github/'; then
            echo "ERROR: Credential pattern detected" >&2
            exit 1
          fi
          echo "Credential scan: PASS"
